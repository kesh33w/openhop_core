<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 470" width="920" height="470" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
  <title>Packet path through the openhop_core fork's multi-radio layer</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="920" height="470" rx="12" fill="#ffffff"/>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0f172a">openhop_core fork: one packet's path</text>
  <text x="24" y="54" fill="#475569">Grey boxes are upstream; blue boxes are added or changed by the fork.</text>

  <!-- radios -->
  <g>
    <rect x="24" y="80" width="170" height="160" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="40" y="102" font-weight="700" fill="#0f172a">Network SMF (909.875)</text>
    <rect x="40" y="114" width="138" height="34" rx="6" fill="#dbeafe" stroke="#2563eb"/>
    <text x="50" y="135" fill="#1e3a8a">g3909 · transceiver</text>
    <rect x="40" y="156" width="138" height="34" rx="6" fill="#dbeafe" stroke="#2563eb"/>
    <text x="50" y="177" fill="#1e3a8a">rak909 · receiver</text>
    <rect x="40" y="198" width="138" height="30" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="4 3"/>
    <text x="50" y="217" fill="#475569">extra · shadow</text>

    <rect x="24" y="260" width="170" height="118" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="40" y="282" font-weight="700" fill="#0f172a">Network SFO (910.525)</text>
    <rect x="40" y="294" width="138" height="34" rx="6" fill="#dbeafe" stroke="#2563eb"/>
    <text x="50" y="315" fill="#1e3a8a">g3910 · transceiver</text>
    <rect x="40" y="336" width="138" height="34" rx="6" fill="#dbeafe" stroke="#2563eb"/>
    <text x="50" y="357" fill="#1e3a8a">rak910 · receiver</text>
  </g>

  <!-- pipeline -->
  <g>
    <rect x="236" y="120" width="150" height="70" rx="10" fill="#dbeafe" stroke="#2563eb"/>
    <text x="250" y="145" font-weight="700" fill="#1e3a8a">USB / TCP driver</text>
    <text x="250" y="164" fill="#1e3a8a">per-packet RSSI/SNR</text>
    <text x="250" y="180" fill="#1e3a8a">fenced sessions</text>

    <rect x="420" y="120" width="150" height="70" rx="10" fill="#dbeafe" stroke="#2563eb"/>
    <text x="434" y="145" font-weight="700" fill="#1e3a8a">RF fabric</text>
    <text x="434" y="164" fill="#1e3a8a">tags radio + network</text>
    <text x="434" y="180" fill="#1e3a8a">(provenance)</text>

    <rect x="604" y="120" width="150" height="70" rx="10" fill="#dbeafe" stroke="#2563eb"/>
    <text x="618" y="145" font-weight="700" fill="#1e3a8a">Logical receiver</text>
    <text x="618" y="164" fill="#1e3a8a">merges copies heard</text>
    <text x="618" y="180" fill="#1e3a8a">by several radios</text>

    <rect x="604" y="230" width="150" height="70" rx="10" fill="#dbeafe" stroke="#2563eb"/>
    <text x="618" y="255" font-weight="700" fill="#1e3a8a">Dispatcher</text>
    <text x="618" y="274" fill="#1e3a8a">dedupe per network</text>
    <text x="618" y="290" fill="#1e3a8a">no bounce-back</text>

    <rect x="786" y="230" width="110" height="70" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="800" y="255" font-weight="700" fill="#334155">Repeater</text>
    <text x="800" y="274" fill="#334155">engine and</text>
    <text x="800" y="290" fill="#334155">bridge</text>

    <rect x="420" y="340" width="150" height="76" rx="10" fill="#dbeafe" stroke="#2563eb"/>
    <text x="434" y="365" font-weight="700" fill="#1e3a8a">Topology TX policy</text>
    <text x="434" y="384" fill="#1e3a8a">sticky / bridge;</text>
    <text x="434" y="400" fill="#1e3a8a">only transceivers send</text>

    <rect x="236" y="340" width="150" height="76" rx="10" fill="#dbeafe" stroke="#2563eb"/>
    <text x="250" y="365" font-weight="700" fill="#1e3a8a">Ordered TX group</text>
    <text x="250" y="384" fill="#1e3a8a">rak910 then g3910;</text>
    <text x="250" y="400" fill="#1e3a8a">all or bridged-only</text>
  </g>

  <!-- arrows -->
  <g stroke="#475569" stroke-width="1.6" fill="none" marker-end="url(#a)">
    <path d="M194 160 H234"/>
    <path d="M194 318 C214 318 214 175 234 175"/>
    <path d="M386 155 H418"/>
    <path d="M570 155 H602"/>
    <path d="M679 190 V228"/>
    <path d="M754 265 H784"/>
    <path d="M841 300 V378 H572"/>
    <path d="M420 378 H388"/>
    <path d="M236 378 C210 378 210 330 196 320"/>
  </g>
  <text x="600" y="372" fill="#475569" font-size="12">send (logical primary)</text>
  <text x="196" y="446" fill="#475569" font-size="12">Physical sends report: confirmed · definitely not sent · uncertain · suppressed duplicate</text>
</svg>
